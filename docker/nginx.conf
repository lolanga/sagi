server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;
    client_max_body_size 32M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Rutas de API: delegan a Laravel (index.php)
    # No comprimir respuestas de la API: PrecompressResponse (middleware Laravel)
    # ya comprime con brotli/gzip y setea Content-Encoding. Comprimir aqui de nuevo
    # produciria doble compresion.
    location /api/ {
        gzip off;
        try_files $uri /index.php?$query_string;
    }

    location /up {
        try_files $uri /index.php?$query_string;
    }

    # Assets con hash de Vite: cache inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: index.html nunca se cachea
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Fallback de la SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
